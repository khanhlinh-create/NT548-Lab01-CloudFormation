AWSTemplateFormatVersion: '2010-09-09'

Parameters:

  VpcId:
    Type: String

Resources:

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.1.0/24

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: PublicSubnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.2.0/24

      Tags:
        - Key: Name
          Value: PrivateSubnet

Outputs:

  PublicSubnetId:
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Value: !Ref PrivateSubnet