AWSTemplateFormatVersion: '2010-09-09'

Parameters:

  PublicSubnetId:
    Type: String

Resources:

  NatEIP:
    Type: AWS::EC2::EIP

    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway

    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnetId

      Tags:
        - Key: Name
          Value: NT548-NAT

Outputs:

  NatGatewayId:
    Value: !Ref NatGateway

  ElasticIP:
    Value: !Ref NatEIP